name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'instant/client/www/**'
      - 'instant/client/package.json'
      - 'instant/client/pnpm-lock.yaml'
  pull_request:
    paths:
      - 'instant/client/www/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd instant/client
          pnpm install --frozen-lockfile
          pnpm run build-packages

      - name: Build dashboard
        run: |
          cd instant/client/www
          NEXT_PUBLIC_SELF_HOSTED=true pnpm run build
        env:
          NEXT_PUBLIC_SELF_HOSTED: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v5
        with:
          context: instant/client/www
          file: instant/client/www/Dockerfile.www
          push: true
          tags: ghcr.io/${{ github.repository }}/daabase2-dashboard:${{ github.sha }}, ghcr.io/${{ github.repository }}/daabase2-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max