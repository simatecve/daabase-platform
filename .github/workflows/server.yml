name: Server

on:
  push:
    branches: [main]
    paths:
      - 'instant/server/**'
      - 'instant/deps.edn'
      - 'instant/build.clj'
  pull_request:
    paths:
      - 'instant/server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '26'

      - name: Install Clojure
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/download/1.11.3.1463/linux-install.sh
          echo '0c41063a2fefb53a31bc1bc236899955f759c5103dc0495489cdd74bf8f114bb  linux-install.sh' | sha256sum -c
          chmod +x linux-install.sh && ./linux-install.sh

      - name: Build uberjar
        run: |
          cd instant/server
          clojure -P
          clojure -T:build uber
        env:
          JAVA_OPTS: "-Xmx4g"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: instant/server
          file: instant/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/daabase2-server:${{ github.sha }}, ghcr.io/${{ github.repository }}/daabase2-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max