name: Admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
  pull_request:
    paths:
      - 'admin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd admin
          pnpm install --frozen-lockfile

      - name: Build admin
        run: |
          cd admin
          pnpm run build
        env:
          NEXT_PUBLIC_SELF_HOSTED: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push admin image
        uses: docker/build-push-action@v5
        with:
          context: admin
          file: admin/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/daabase-platform-admin:${{ github.sha }}, ghcr.io/${{ github.repository }}/daabase-platform-admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max